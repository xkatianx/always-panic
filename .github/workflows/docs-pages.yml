name: Deploy API docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # TypeDoc 0.28 still needs the JS compiler API; TypeScript 7 (native) does
      # not expose it (`SyntaxKind.PropertyDeclaration` is undefined). Pin 6.x
      # only for this job — lift when TypeDoc supports 7.
      # https://github.com/TypeStrong/typedoc/issues/3098
      - name: Pin TypeScript 6 for TypeDoc
        run: bun add --dev typescript@6.0.3

      - name: Generate docs site
        run: bun run docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
