name: PR to main

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-main-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Fetch latest main from base repository
        run: |
          git fetch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main

      - name: Require package.json version bump vs main
        run: |
          MAIN_VER=$(git show FETCH_HEAD:package.json | jq -r .version)
          HEAD_VER=$(jq -r .version package.json)
          echo "Version on main: $MAIN_VER"
          echo "Version on PR head: $HEAD_VER"
          if [ "$MAIN_VER" = "$HEAD_VER" ]; then
            echo "::error::package.json version must differ from main ($MAIN_VER). Bump the version for this PR."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Biome check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Fail if build produced uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build or Biome left the tree dirty. Run \`bun run check:write\` and \`bun run build\` locally, commit all results (including dist), and push."
            git status
            git diff
            exit 1
          fi

      - name: Test
        run: bun test
