name: PR ready

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string

concurrency:
  group: pr-ready-${{ github.repository }}-${{ github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR head
        id: pr-head
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = Number.parseInt(
              context.payload.inputs.pr_number,
              10,
            );
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            core.setOutput("sha", pr.head.sha);
            core.setOutput("repository", pr.head.repo.full_name);

      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr-head.outputs.sha }}
          repository: ${{ steps.pr-head.outputs.repository }}

      - name: Merge gate passed
        run: echo "PR head ${{ steps.pr-head.outputs.sha }} is ready to merge."
